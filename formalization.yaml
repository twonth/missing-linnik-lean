  relationship: adapts
  author_endorsement: not-contacted
  note: Intended adaptation to all x above an effective conductor power, as required
    by Proposition 2.
- title: A Frobenius determinant proof of the non-existence of Landau–Siegel zeros
  authors:
  - R. van Dijk
  type: article
  id: https://hexagonmath.org/pdf/2610.00409v1
  relationship: adapts
  author_endorsement: not-contacted
  note: Read from the author's PDF supplied by the user. The intended adaptation uses
    the largest inert prime below x and derives the weighted prime bound directly,
    without assuming a hypothetical exceptional zero. This records the original adapted
    source; the current manuscript bibliography cites version 2.
- title: A direct argument for Linnik's theorem
  type: working note
  id: User-supplied document (4).pdf
  location: Section 3, triangular determinant variant
  relationship: adapts
  author_endorsement: n/a
  note: User requested this as a third proof of Proposition 2; no authorship is inferred
    from the upload.
