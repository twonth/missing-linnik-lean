  effectivity: one_parameter gives coefficient 1/2+70000/t for x>=f^(t^2); exponent(k)=(70000*(k+1))^2
    is proved computable.
  outstanding: []
  proof_fidelity: The triangular proof reuses prior minor, divisibility and size estimates,
    improves the slope error to linear, and uses internal slope 1024t. The main proof
    retains prior von Mangoldt weights and sufficient earlier sieve constants. The
    sharpened R^2 and z^(3h) estimates are separately proved. The sieve theorem uses
    integer parameters and 0<=n<N; arbitrary real interval endpoints and real z conversions
    are not separately packaged. See VERIFICATION.txt. The two additional Comparator
    targets retain von Mangoldt weights and use B=170k. A general prime-only restatement
    of Proposition 3 and arbitrary-integer-B packaging are not separate formal theorems.
    The character bridge uses a bounded integer representative rather than identifying
    the manuscript's exact fundamental discriminant. See Verification/manuscript-alignment.md.
    The October 25 real-h extension uses floor(h), changing 16 exp(32-h) to 16 exp(33-h).
    The direct negative-mass bound is used in positive_sign_excluded, which remains
    on the Linnik dependency path.
  unbounded_x: symmetry_two_unbounded holds for x>=1; symmetry_three_unbounded for
    x>=Y, where Y=q^(170k). There is no upper restriction on x. With B=170k and Z=q^(B^2),
    log(Y)/log(x)<=1/B for every x>=Z.
