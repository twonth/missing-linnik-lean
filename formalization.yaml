  id: https://personal.science.psu.edu/rcv4/personal/Publications/MNTI/13.0_pp_282_325_Primitive_characters_and_Gauss_sums.pdf
  location: Section 9.3, Theorem 9.13
  relationship: adapts
  author_endorsement: not-contacted
  note: 'Completed replacement bridge: local classification at odd prime powers and
