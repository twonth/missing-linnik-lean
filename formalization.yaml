version: v0.4
project:
  name: The Missing Lin(ni)k
  description: 'Current manuscript: one-parameter triangular van Dijk anti-concentration,
    effective Proposition 2, Linnik via the earlier symmetry proof, and the sharpened
    Selberg sieve with z^(3h) additive error. The 25 October recertification explicitly
    checks the unrestricted-x quantitative symmetry estimates underlying Proposition
    3. The October 25 update incorporates the direct negative-mass sign argument and
    extends the sieve to real h.'
  authors:
  - OpenAI Codex, working at Paul Pollack's request
  license: Not specified; no distribution license is asserted
